# Sri Venkateswara Company (SVC) — Netlify Production Configuration

[build]
  publish = "."

# Production Headers for Performance, Security & Caching
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Long-term Caching for Static Production Assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fallback for unknown routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

